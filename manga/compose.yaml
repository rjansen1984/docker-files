services:
  komf:
    image: sndxr/komf:2.0.1
    container_name: komf
    cpu_shares: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      komga:
        condition: service_healthy
    environment:
      - KOMF_LOG_LEVEL=${KOMF_LOG_LEVEL}
      - TZ=${TZ}
    volumes:
      - /${APP_VOLUME_DIR}/komf/config:/config
    ports:
      - 8085:8085
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - docker-network

  komga:
    image: ghcr.io/gotson/komga:1.26.3
    container_name: komga
    cpu_shares: 512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:25600/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    user: 1026:100
    environment:
     - KOMGA_CORS_ALLOWED_ORIGINS=${KOMGA_CORS_ALLOWED_ORIGINS}
     - TZ=${TZ}
    volumes:
      - /${APP_VOLUME_DIR}/komga/config:/config:rw
      - /${COMICS_VOLUME_DIR}:/comics:rw
      - /${MANGA_VOLUME_DIR}:/manga:rw
    ports:
      - 25600:25600
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - docker-network

networks:
  docker-network:
    external: true