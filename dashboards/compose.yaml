services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.1.2
    container_name: homepage
    cpu_shares: 512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
    volumes:
      - /${APP_VOLUME_DIR}/homepage:/app/config:rw
      - /${APP_VOLUME_DIR}/homepage/public:/app/public/images:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 3550:3000
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - docker-network

networks:
  docker-network:
    external: true