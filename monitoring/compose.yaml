services:
  glances:
    container_name: glances
    cpu_shares: 512
    restart: unless-stopped
    image: nicolargo/glances:4.5.6
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:61208/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    pid: host
    privileged: true
    environment:
      GLANCES_OPT: -w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 61208:61208
    deploy:
      resources:
        limits:
          memory: 256M
    network_mode: host

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.2.0
    container_name: homepage
    cpu_shares: 512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
    volumes:
      - /${APP_VOLUME_DIR}/homepage:/app/config:rw
      - /${APP_VOLUME_DIR}/homepage/public:/app/public/images:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 3550:3000
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - docker-network

  uptimekuma:
    image: louislam/uptime-kuma:2.5.3
    container_name: uptimekuma
    cpu_shares: 1024
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s
    environment:
      TZ: ${TZ}
    volumes:
      - /${APP_VOLUME_DIR}/uptimekuma:/app/data:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 3444:3001
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - docker-network

networks:
  docker-network:
    external: true